
name: Pomme-iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Pomme iOS
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout Pomme
        uses: actions/checkout@v4
        with:
          repository: PommeMC/Client
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install xcodegen cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec pomme-ios/project.yml

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath target/ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Pomme.app not found"
            find target/ios-build -name "*.app"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Pomme.app

          zip -r Pomme-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS
          path: Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
