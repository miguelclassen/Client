name: Pomme-iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Pomme iOS
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout Pomme
        uses: actions/checkout@v4
        with:
          repository: PommeMC/Client
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install just xcodegen cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Inspect iOS build configuration
        run: |
          just --list
          ls -la pomme-ios

      - name: Build iOS
        run: |
          just ios-build

      - name: Package unsigned IPA
        run: |
          APP=$(find . -type d -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Pomme-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS
          path: Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
