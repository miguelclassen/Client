
name: Pomme-iOS

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Pomme iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 240

    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-21
      RUST_BACKTRACE: full

    steps:
      # 1. Repository
      - name: Checkout Pomme
        uses: actions/checkout@v4
        with:
          repository: PommeMC/Client
          ref: master
          submodules: recursive
          fetch-depth: 0

      # 2. Dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen cmake

          xcodebuild -version
          cmake --version
          python3 --version

      # 3. Vulkan SDK for host-side shaderc
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.4.363.0"
          DOWNLOAD="$RUNNER_TEMP/vulkan"
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK/$VERSION"

          mkdir -p "$DOWNLOAD" "$SDK_ROOT"

          curl -fL --retry 3 \
            "https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip" \
            -o "$DOWNLOAD/vulkan.zip"

          unzip -q "$DOWNLOAD/vulkan.zip" -d "$DOWNLOAD"

          APP="$(find "$DOWNLOAD" \
            -maxdepth 5 \
            -type d \
            -name "*.app" \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Vulkan installer app not found"
            find "$DOWNLOAD" -maxdepth 4 -print
            exit 1
          fi

          INSTALLER="$(find "$APP/Contents/MacOS" \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print -quit)"

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: Vulkan installer executable not found"
            exit 1
          fi

          chmod +x "$INSTALLER"

          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install copy_only=1

          VULKAN_SDK="$SDK_ROOT/macOS"

          echo "Checking Vulkan SDK..."

          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -f "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

          echo "Vulkan SDK ready: $VULKAN_SDK"

      # 4. Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-21
          components: rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # 5. Enable static shaderc linking
      - name: Configure shaderc
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pomme-client/Cargo.toml")
          content = path.read_text()

          old = r'(?m)^shaderc\s*=\s*"0\.10"\s*$'
          new = 'shaderc = { version = "0.10", features = ["prefer-static-linking"] }'

          if new in content:
              print("Static shaderc linking already enabled")
          elif len(re.findall(old, content)) == 1:
              content = re.sub(old, new, content)
              path.write_text(content)
              print("Enabled static shaderc linking")
          else:
              raise SystemExit(
                  "ERROR: Expected shaderc = \"0.10\" exactly once in pomme-client/Cargo.toml"
              )
          PY

          grep -n "shaderc" pomme-client/Cargo.toml

          SHADERC_LIB="$VULKAN_SDK/lib/libshaderc_combined.a"

          test -f "$SHADERC_LIB"

          # lipo syntax: input file first, then operation
          lipo "$SHADERC_LIB" -verify_arch x86_64

          echo "Static shaderc library verified"

      # 6. Verify Rust and SDK
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          echo "Installed Rust targets:"
          rustup target list --installed

          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -f "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "Build environment verified"

      # 7. Generate Xcode project
      - name: Generate Xcode project
        working-directory: pomme-ios
        shell: bash
        run: |
          set -euo pipefail

          xcodegen generate --quiet

          test -d Pomme.xcodeproj

          xcodebuild -list -project Pomme.xcodeproj

      # 8. Build the actual iOS application
      - name: Build Pomme iOS
        shell: bash
        run: |
          set -euo pipefail

          export VULKAN_SDK
          export PATH="$HOME/.cargo/bin:$VULKAN_SDK/bin:$PATH"

          echo "Host Vulkan SDK: $VULKAN_SDK"
          echo "Building using original pomme-ios/build-app.sh"

          xcodebuild \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath target/ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-build.log

      # 9. Verify application
      - name: Verify Pomme.app
        shell: bash
        run: |
          set -euo pipefail

          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Pomme.app not found"
            find target/ios-build -name "*.app" -type d
            exit 1
          fi

          test -f "$APP/Pomme"
          test -f "$APP/Info.plist"

          plutil -lint "$APP/Info.plist"

          echo "Checking executable architecture..."
          file "$APP/Pomme"
          lipo "$APP/Pomme" -verify_arch arm64

          echo "Pomme.app verified"

      # 10. Package unsigned IPA
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          rm -rf Payload Pomme-unsigned.ipa
          mkdir -p Payload

          ditto "$APP" Payload/Pomme.app

          zip -qry Pomme-unsigned.ipa Payload

          test -s Pomme-unsigned.ipa
          unzip -t Pomme-unsigned.ipa

          echo "IPA successfully created"
          ls -lh Pomme-unsigned.ipa

      # 11. Upload IPA
      - name: Upload Pomme-iOS
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS
          path: Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # 12. Save logs if build fails
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-Build-Logs
          path: |
            ios-build.log
            target/ios-build/Logs/
          if-no-files-found: ignore
          retention-days: 7
