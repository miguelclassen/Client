
name: Pomme iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: pomme-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 240

    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-21
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      # 1. Check out the repository and its submodules
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Fix stdout contamination in the MoltenVK download script.
      # build-app.sh captures fetch_moltenvk.py stdout as VULKAN_SDK.
      # Download messages must therefore go to stderr.
      - name: Fix MoltenVK download output
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/fetch_openal.py")
          content = path.read_text()

          old = 'print(f"downloading {url}")'
          new = 'print(f"downloading {url}", file=sys.stderr)'

          if new in content:
              print("MoltenVK output fix already present")
          elif content.count(old) == 1:
              if "import sys" not in content:
                  raise SystemExit("ERROR: fetch_openal.py does not import sys")

              path.write_text(content.replace(old, new))
              print("MoltenVK output fix applied")
          else:
              raise SystemExit(
                  "ERROR: Could not safely patch tools/fetch_openal.py"
              )
          PY

          grep -n "downloading" tools/fetch_openal.py

      # 3. Install native build dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen cmake

          echo "Xcode:"
          xcodebuild -version

          echo "CMake:"
          cmake --version

          echo "Python:"
          python3 --version

          echo "Architecture:"
          uname -m

      # 4. Install the Vulkan SDK for host-side shaderc
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.4.363.0"
          DOWNLOAD="$RUNNER_TEMP/vulkan"
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK/$VERSION"

          mkdir -p "$DOWNLOAD" "$SDK_ROOT"

          curl -fL --retry 5 --retry-all-errors \
            "https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip" \
            -o "$DOWNLOAD/vulkan.zip"

          unzip -q "$DOWNLOAD/vulkan.zip" -d "$DOWNLOAD"

          APP="$(python3 - "$DOWNLOAD" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          apps = sorted(
              p for p in root.iterdir()
              if p.is_dir() and p.suffix == ".app"
          )

          if not apps:
              raise SystemExit("ERROR: Vulkan installer app not found")

          print(apps[0])
          PY
          )"

          INSTALLER="$(python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          macos = app / "Contents" / "MacOS"
          expected = macos / app.stem

          if expected.is_file():
              print(expected)
          else:
              files = sorted(p for p in macos.iterdir() if p.is_file())

              if len(files) != 1:
                  raise SystemExit(
                      "ERROR: Could not identify Vulkan installer executable"
                  )

              print(files[0])
          PY
          )"

          test -f "$INSTALLER"
          chmod +x "$INSTALLER"

          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install copy_only=1

          VULKAN_SDK="$SDK_ROOT/macOS"

          echo "Checking Vulkan SDK..."

          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -f "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

          echo "Vulkan SDK installed:"
          echo "$VULKAN_SDK"

      # 5. Install the exact Rust toolchain from rust-toolchain.toml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-21
          components: rust-src,clippy,rustfmt,rust-analyzer
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # 6. Make shaderc prefer the static library.
      # This avoids linking against shaderc_shared.dylib at runtime.
      - name: Configure static shaderc linking
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("pomme-client/Cargo.toml")
          content = path.read_text()

          old = 'shaderc = "0.10"'
          new = 'shaderc = { version = "0.10", features = ["prefer-static-linking"] }'

          if new in content:
              print("Static shaderc linking already configured")
          elif content.count(old) == 1:
              path.write_text(content.replace(old, new))
              print("Static shaderc linking enabled")
          else:
              raise SystemExit(
                  'ERROR: Expected shaderc = "0.10" exactly once'
              )
          PY

          grep -n "shaderc" pomme-client/Cargo.toml

          SHADERC_LIB="$VULKAN_SDK/lib/libshaderc_combined.a"

          test -s "$SHADERC_LIB"

          echo "Checking shaderc architecture..."
          lipo "$SHADERC_LIB" -verify_arch x86_64

          echo "Static shaderc library verified"

      # 7. Verify the build environment
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          echo "Installed Rust targets:"
          rustup target list --installed

          rustup target list --installed | grep -Fx "aarch64-apple-ios"
          rustup target list --installed | grep -Fx "aarch64-apple-ios-sim"

          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -s "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "Build environment verified"

      # 8. Generate the Xcode project
      - name: Generate Xcode project
        working-directory: pomme-ios
        shell: bash
        run: |
          set -euo pipefail

          xcodegen generate

          test -d Pomme.xcodeproj

          xcodebuild -list -project Pomme.xcodeproj

      # 9. Download and verify MoltenVK before Xcode starts.
      # The stdout of fetch_moltenvk.py must contain only the directory.
      - name: Prepare MoltenVK
        shell: bash
        run: |
          set -euo pipefail

          MOLTENVK_DIR="$(python3 tools/fetch_moltenvk.py ios)"

          test -s "$MOLTENVK_DIR/lib/libvulkan.a"

          echo "MoltenVK directory:"
          echo "$MOLTENVK_DIR"

          echo "MoltenVK library:"
          file "$MOLTENVK_DIR/lib/libvulkan.a"

      # 10. Build the iOS application using the repository's original script
      - name: Build Pomme iOS
        shell: bash
        run: |
          set -euo pipefail

          export VULKAN_SDK
          export PATH="$HOME/.cargo/bin:$VULKAN_SDK/bin:$PATH"

          echo "Using Vulkan SDK:"
          echo "$VULKAN_SDK"

          xcodebuild \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/target/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-build.log

      # 11. Verify the generated application
      - name: Verify Pomme.app
        shell: bash
        run: |
          set -euo pipefail

          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Pomme.app was not generated"

            find target/ios-build -name "*.app" -print || true

            exit 1
          fi

          test -s "$APP/Pomme"
          test -s "$APP/Info.plist"
          test -d "$APP/Frameworks/soft_oal.framework"

          plutil -lint "$APP/Info.plist"

          echo "Checking iOS executable..."
          file "$APP/Pomme"
          lipo "$APP/Pomme" -verify_arch arm64

          echo "Checking embedded OpenAL framework..."
          test -s "$APP/Frameworks/soft_oal.framework/soft_oal"

          echo "Pomme.app verified"

      # 12. Package the unsigned IPA
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          rm -rf Payload Pomme-unsigned.ipa

          mkdir -p Payload

          ditto "$APP" Payload/Pomme.app

          zip -qry Pomme-unsigned.ipa Payload

          test -s Pomme-unsigned.ipa

          echo "Testing IPA archive..."
          unzip -t Pomme-unsigned.ipa

          echo "Checking IPA structure..."
          unzip -Z1 Pomme-unsigned.ipa | grep -Fx "Payload/Pomme.app/Info.plist"
          unzip -Z1 Pomme-unsigned.ipa | grep -Fx "Payload/Pomme.app/Pomme"

          echo "IPA successfully created:"
          ls -lh Pomme-unsigned.ipa

      # 13. Upload the IPA
      - name: Upload Pomme iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-unsigned
          path: Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # 14. Upload diagnostic logs if anything fails
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-Build-Logs
          path: |
            ios-build.log
            target/ios-build/Logs/
            target/openal-soft/
            target/moltenvk/
          if-no-files-found: ignore
          retention-days: 7
