
name: Pomme-iOS

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15-intel
    timeout-minutes: 240

    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-21
      RUST_BACKTRACE: full

    steps:
      # 1. Repository herunterladen
      - name: Checkout Pomme
        uses: actions/checkout@v4
        with:
          repository: PommeMC/Client
          ref: master
          submodules: recursive
          fetch-depth: 0

      # 2. Build-Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install xcodegen cmake ninja

          xcodebuild -version
          cmake --version
          python3 --version

      # 3. Vulkan SDK installieren
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.4.363.0"
          DOWNLOAD="$RUNNER_TEMP/vulkan"
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK/$VERSION"

          mkdir -p "$DOWNLOAD" "$SDK_ROOT"

          curl -fL --retry 3 \
            "https://sdk.lunarg.com/sdk/download/${VERSION}/mac/vulkansdk-macos-${VERSION}.zip" \
            -o "$DOWNLOAD/vulkan.zip"

          unzip -q "$DOWNLOAD/vulkan.zip" -d "$DOWNLOAD"

          APP="$(find "$DOWNLOAD" \
            -maxdepth 4 -type d -name "*.app" \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Vulkan installer app not found"
            exit 1
          fi

          INSTALLER="$(find "$APP/Contents/MacOS" \
            -maxdepth 1 -type f -perm -111 \
            -print -quit)"

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: Vulkan installer executable not found"
            exit 1
          fi

          chmod +x "$INSTALLER"

          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install copy_only=1

          VULKAN_SDK="$SDK_ROOT/macOS"

          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -f "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

          echo "Vulkan SDK installed:"
          echo "$VULKAN_SDK"

      # 4. Rust installieren
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-21
          components: rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # 5. Statisches shaderc-Linking aktivieren
      - name: Configure static shaderc linking
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="pomme-client/Cargo.toml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("pomme-client/Cargo.toml")
          content = path.read_text()

          old = 'shaderc = "0.10"'
          new = 'shaderc = { version = "0.10", features = ["prefer-static-linking"] }'

          if new in content:
              print("Static shaderc linking is already enabled")
          elif content.count(old) == 1:
              path.write_text(content.replace(old, new))
              print("Enabled prefer-static-linking")
          else:
              raise SystemExit(
                  "ERROR: Could not safely locate shaderc dependency in Cargo.toml"
              )
          PY

          grep -n "shaderc" "$MANIFEST"

          test -f "$VULKAN_SDK/lib/libshaderc_combined.a"

          lipo -verify_arch x86_64 \
            "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "Static shaderc library verified"

      # 6. Rust- und Vulkan-Umgebung überprüfen
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          rustup target list --installed

          test -f "$VULKAN_SDK/share/vulkan/registry/vk.xml"
          test -f "$VULKAN_SDK/lib/libshaderc_combined.a"

          echo "Build environment OK"

      # 7. Xcode-Projekt generieren
      - name: Generate Xcode project
        working-directory: pomme-ios
        run: |
          set -euo pipefail

          xcodegen generate --quiet

          test -d Pomme.xcodeproj

          xcodebuild -list -project Pomme.xcodeproj

      # 8. iOS-App bauen
      - name: Build Pomme iOS
        shell: bash
        run: |
          set -euo pipefail

          export VULKAN_SDK
          export PATH="$HOME/.cargo/bin:$VULKAN_SDK/bin:$PATH"

          echo "Building Pomme for iOS..."

          xcodebuild \
            -project pomme-ios/Pomme.xcodeproj \
            -scheme Pomme \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath target/ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ios-build.log

      # 9. App überprüfen
      - name: Verify Pomme.app
        shell: bash
        run: |
          set -euo pipefail

          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Pomme.app was not created"
            find target/ios-build -name "*.app" -type d
            exit 1
          fi

          test -f "$APP/Pomme"
          test -f "$APP/Info.plist"

          plutil -lint "$APP/Info.plist"

          echo "Pomme.app successfully verified"

      # 10. Unsigned IPA erstellen
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="target/ios-build/Build/Products/Release-iphoneos/Pomme.app"

          rm -rf Payload Pomme-unsigned.ipa
          mkdir -p Payload

          ditto "$APP" Payload/Pomme.app

          zip -qry Pomme-unsigned.ipa Payload

          test -s Pomme-unsigned.ipa
          unzip -t Pomme-unsigned.ipa

          echo "IPA successfully created:"
          ls -lh Pomme-unsigned.ipa

      # 11. IPA als GitHub Artifact hochladen
      - name: Upload Pomme-iOS
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS
          path: Pomme-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # 12. Build-Logs bei Fehlern sichern
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS-Build-Logs
          path: |
            ios-build.log
            target/ios-build/Logs/
          if-no-files-found: ignore
          retention-days: 7
